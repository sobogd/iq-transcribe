# transcribe.iq-factura.com → transcribe (Next.js, PM2 :8202)
# Install on prod as /etc/nginx/sites-available/transcribe.conf
#   ln -s ../sites-available/transcribe.conf /etc/nginx/sites-enabled/
#   certbot --nginx -d transcribe.iq-factura.com   (adds the TLS lines)
#   nginx -t && systemctl reload nginx
server {
  server_name transcribe.iq-factura.com;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

  # video uploads — allow large request bodies (1h+ HD video can exceed 512M)
  client_max_body_size 2048M;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  location / {
    proxy_pass http://127.0.0.1:8202;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  listen 80;
  listen [::]:80;
}
